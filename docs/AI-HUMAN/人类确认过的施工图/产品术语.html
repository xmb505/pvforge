<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>产品定位与术语图解 · PVForge</title>
<style>
  :root{
    --bg:#0f1114;--panel:#181b1e;--panel2:#20242a;--line:#343b42;--line2:#4a525a;
    --text:#e6e8ea;--dim:#9aa3ac;--faint:#667079;--amber:#ffb000;--cyan:#4cc9f0;
    --green:#43d17a;--red:#ff5d5d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font:12px/1.5 "Noto Sans Mono CJK SC","JetBrains Mono",monospace;padding:20px}
  .sheet{max-width:1100px;margin:0 auto;border:1px solid var(--line2);background:var(--panel)}
  .head{display:flex;align-items:center;gap:14px;padding:12px 18px;background:#1f2328;border-bottom:1px solid var(--line2)}
  .mark{width:30px;height:30px;background:var(--amber);color:#161000;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
  .head h1{font-size:17px}
  .badge{margin-left:auto;border:1px solid #2c6b43;color:var(--green);padding:2px 8px;font-size:11px}
  .body{padding:16px 18px}
  .pill-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .pill{background:#121518;border:1px solid var(--line2);padding:5px 10px;font-size:11px;color:#cfd6dd}
  .pill b{color:var(--amber)}
  .frame{background:#0e1013;border:1px solid var(--line2);padding:10px}
  .foot{padding:8px 18px;border-top:1px solid var(--line2);background:#15181b;color:var(--faint);font-size:11px;display:flex;justify-content:space-between}
</style>
</head>
<body>
<div class="sheet">
  <header class="head">
    <div class="mark">工</div>
    <h1>1. 产品定位与核心术语（UI 区域解剖图）</h1>
    <span class="badge">已确认 · 2026-11-16</span>
  </header>

  <div class="body">
    <div class="pill-row">
      <div class="pill"><b>定位</b>：学过 Mine-imator 就能画 PV（3D 工作流下的 2D）</div>
      <div class="pill"><b>第一优先</b>：适配作者心智模型</div>
      <div class="pill"><b>兼容策略</b>：不做旧工程兼容</div>
    </div>

    <div class="frame">
      <svg viewBox="0 0 1040 430" width="100%" style="display:block">
        <!-- 舞台窗口 -->
        <rect x="14" y="14" width="660" height="250" fill="#13161a" stroke="#4cc9f0" stroke-width="2"/>
        <text x="26" y="34" fill="#4cc9f0" font-size="12" font-weight="bold">① 舞台 (Stage) = 视口窗口（OBS 式可拆出）</text>

        <!-- 工作台按钮 -->
        <rect x="26" y="48" width="110" height="28" rx="3" fill="#ffb000"/>
        <text x="81" y="66" fill="#161000" font-size="11" font-weight="bold" text-anchor="middle">② 工作台 ▾</text>
        <text x="146" y="66" fill="#ffb000" font-size="10">← 创建实体的工具箱（MI 原版语义，非画布）</text>

        <!-- 画布 & 摄像机 -->
        <rect x="140" y="90" width="400" height="156" fill="#1b2026" stroke="#9aa3ac" stroke-dasharray="4,2"/>
        <text x="150" y="108" fill="#cfd6dd" font-size="11">③ 画布 (Canvas)：原点 (0,0) 在正中心</text>

        <rect x="200" y="122" width="270" height="108" fill="#212832" stroke="#ffb000"/>
        <text x="210" y="140" fill="#ffb000" font-size="11">④ 摄像机 (Camera)：决定出片画面与时长</text>

        <rect x="285" y="158" width="96" height="48" fill="#2a3a4a" stroke="#43d17a"/>
        <text x="333" y="186" fill="#43d17a" font-size="11" text-anchor="middle">⑤ 实体 (Entity)</text>

        <!-- 小监视器 -->
        <rect x="554" y="176" width="110" height="78" fill="#181b1e" stroke="#43d17a"/>
        <text x="609" y="218" fill="#43d17a" font-size="10" text-anchor="middle">小监视器</text>

        <!-- 右侧说明卡：1:1 & 素材分离 -->
        <rect x="692" y="14" width="334" height="250" fill="#181b1e" stroke="#343b42"/>
        <text x="708" y="38" fill="#ffb000" font-size="12" font-weight="bold">核心对象关系</text>
        <rect x="708" y="54" width="302" height="60" fill="#121518" stroke="#43d17a"/>
        <text x="720" y="76" fill="#43d17a" font-size="11">⑤ 实体  ≡  ⑥ 片段（严格 1:1 合一）</text>
        <text x="720" y="96" fill="#9aa3ac" font-size="10">舞台中叫实体，时间轴上叫片段，同一份数据</text>

        <rect x="708" y="128" width="302" height="60" fill="#121518" stroke="#4cc9f0"/>
        <text x="720" y="150" fill="#4cc9f0" font-size="11">⑦ 素材 (Asset) 与实体分离</text>
        <text x="720" y="170" fill="#9aa3ac" font-size="10">按哈希入库 · 实体可换素材 · 丢失显占位</text>

        <rect x="708" y="202" width="302" height="48" fill="#121518" stroke="#ffb000"/>
        <text x="720" y="224" fill="#ffb000" font-size="11">⑨ 图层排序机</text>
        <text x="720" y="240" fill="#9aa3ac" font-size="10">每帧按私有正/负轨道递归算遮挡</text>

        <!-- 下方：素材箱 + 时间轴 + 私有时间线 -->
        <rect x="14" y="276" width="170" height="140" fill="#181b1e" stroke="#4cc9f0"/>
        <text x="24" y="298" fill="#4cc9f0" font-size="11" font-weight="bold">⑦ 素材箱</text>
        <text x="24" y="320" fill="#9aa3ac" font-size="10">拖入右侧即生成片段</text>

        <rect x="196" y="276" width="830" height="140" fill="#121518" stroke="#343b42"/>
        <text x="208" y="296" fill="#cfd6dd" font-size="11">⑧ 轨道 (Track) = 纯图层行号，从下往上无限延伸（同行不重叠）</text>

        <!-- 私有时间线 -->
        <rect x="360" y="306" width="280" height="48" fill="#1b2026" stroke="#ffb000"/>
        <text x="372" y="326" fill="#ffb000" font-size="10">⑩ 私有时间线（悬浮在片段上方）</text>
        <text x="372" y="344" fill="#9aa3ac" font-size="10">+正轨(上层) / -负轨(下层) · 绝对/相对</text>

        <!-- 片段 -->
        <rect x="360" y="362" width="280" height="36" fill="#28303a" stroke="#43d17a"/>
        <text x="372" y="384" fill="#43d17a" font-size="11">⑥ 片段 (Clip) ≡ 实体   [+]</text>
      </svg>
    </div>
  </div>

  <footer class="foot">
    <span>PVForge · 施工图 #1</span>
    <span>2026-11-16 UI 图示化改版</span>
  </footer>
</div>
</body>
</html>
