<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>导出 UI 施工图 · PVForge</title>
<style>
  :root{
    --bg:#0f1114;--panel:#181b1e;--line:#343b42;--line2:#4a525a;
    --text:#e6e8ea;--dim:#9aa3ac;--faint:#667079;--amber:#ffb000;--cyan:#4cc9f0;
    --green:#43d17a;--red:#ff5d5d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font:12px/1.5 "Noto Sans Mono CJK SC","JetBrains Mono",monospace;padding:20px}
  .sheet{max-width:1060px;margin:0 auto;border:1px solid var(--line2);background:var(--panel)}
  .head{display:flex;align-items:center;gap:14px;padding:12px 18px;background:#1f2328;border-bottom:1px solid var(--line2)}
  .mark{width:30px;height:30px;background:var(--amber);color:#161000;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
  .head h1{font-size:17px}
  .badge{margin-left:auto;border:1px solid #2c6b43;color:var(--green);padding:2px 8px;font-size:11px}
  .body{padding:16px 18px}
  h2{font-size:12px;letter-spacing:1.2px;color:var(--amber);border-bottom:1px solid var(--line);padding-bottom:4px;margin:14px 0 10px}
  .box{background:#121518;border:1px solid var(--line);padding:12px}
  .foot{padding:8px 18px;border-top:1px solid var(--line2);background:#15181b;color:var(--faint);font-size:11px;display:flex;justify-content:space-between}
</style>
</head>
<body>
<div class="sheet">
  <header class="head">
    <div class="mark">工</div>
    <h1>8. 导出弹窗 UI（选定摄像机 · 存活时间 = 导出时长）</h1>
    <span class="badge">已确认 · 2026-11-17</span>
  </header>

  <div class="body">
    <h2>1. 导出弹窗布局与摄像机时长绑定</h2>
    <div class="box">
      <svg viewBox="0 0 980 320" width="100%" style="display:block">
        <!-- 弹窗外框 -->
        <rect x="20" y="10" width="940" height="300" rx="4" fill="#181b1e" stroke="#4a525a" stroke-width="1.5"/>
        <rect x="20" y="10" width="940" height="28" fill="#20242a" stroke="#343b42"/>
        <text x="34" y="28" fill="#ffb000" font-size="12" font-weight="bold">导出成片 (MP4 / FFmpeg)</text>

        <!-- 左半：实时渲染预览窗 -->
        <rect x="36" y="54" width="440" height="210" fill="#0d1014" stroke="#4cc9f0"/>
        <text x="256" y="154" fill="#9aa3ac" font-size="12" text-anchor="middle">实时渲染预览画面（高清原图 + HTML 高分进程）</text>
        <text x="256" y="174" fill="#667079" font-size="10" text-anchor="middle">无 Gizmo / 无辅助线 · 仅渲染选定摄像机取景框</text>
        <!-- 进度条与 FPS -->
        <rect x="36" y="274" width="440" height="18" fill="#121518" stroke="#343b42"/>
        <rect x="36" y="274" width="250" height="18" fill="#2c6b43"/>
        <text x="256" y="287" fill="#e6e8ea" font-size="10" text-anchor="middle">57% · 速度 42.5 FPS · 预估剩余 00:14</text>

        <!-- 右半：参数设置（核心：选摄像机） -->
        <text x="500" y="72" fill="#ffb000" font-size="11">1. 选择导出摄像机（必选）：</text>
        <rect x="500" y="82" width="440" height="30" fill="#20242a" stroke="#ffb000"/>
        <text x="512" y="101" fill="#e6e8ea" font-size="11">🎥 主摄像机 A  [存活区间: 30f ~ 1830f] ▾</text>

        <rect x="500" y="122" width="440" height="44" fill="#14221a" stroke="#43d17a"/>
        <text x="512" y="140" fill="#43d17a" font-size="11">导出总时长 = 选定摄像机的存活时间</text>
        <text x="512" y="157" fill="#9aa3ac" font-size="10">自动锁定区间 30f ~ 1830f（共 1800 帧 / 30.0s @60fps）</text>

        <text x="500" y="190" fill="#cfd6dd" font-size="11">2. 编码与画质：</text>
        <rect x="500" y="200" width="214" height="28" fill="#20242a" stroke="#343b42"/>
        <text x="510" y="218" fill="#cfd6dd" font-size="10">解码/编码：硬件加速 / 软解 ▾</text>
        <rect x="726" y="200" width="214" height="28" fill="#20242a" stroke="#343b42"/>
        <text x="736" y="218" fill="#cfd6dd" font-size="10">分辨率：1920×1080 · 60fps</text>

        <rect x="500" y="236" width="440" height="28" fill="#20242a" stroke="#343b42"/>
        <text x="510" y="254" fill="#9aa3ac" font-size="10">输出路径：/home/xmb505/视频/output.mp4   [浏览...]</text>

        <!-- 按钮 -->
        <rect x="750" y="272" width="90" height="26" rx="2" fill="#20242a" stroke="#4a525a"/>
        <text x="795" y="289" fill="#cfd6dd" font-size="11" text-anchor="middle">取消</text>
        <rect x="850" y="272" width="90" height="26" rx="2" fill="#ffb000"/>
        <text x="895" y="289" fill="#161000" font-size="11" font-weight="bold" text-anchor="middle">开始导出</text>
      </svg>
    </div>
  </div>

  <footer class="foot">
    <span>PVForge · 施工图 #8</span>
    <span>2026-11-17 待人类看图拍板</span>
  </footer>
</div>
</body>
</html>
