<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>渲染与缓存施工图 · PVForge</title>
<style>
  :root{
    --bg:#0f1114;--panel:#181b1e;--panel2:#20242a;--line:#343b42;--line2:#4a525a;
    --text:#e6e8ea;--dim:#9aa3ac;--faint:#667079;--amber:#ffb000;--cyan:#4cc9f0;
    --green:#43d17a;--red:#ff5d5d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font:12px/1.5 "Noto Sans Mono CJK SC","JetBrains Mono",monospace;padding:20px}
  .sheet{max-width:1100px;margin:0 auto;border:1px solid var(--line2);background:var(--panel)}
  .head{display:flex;align-items:center;gap:14px;padding:12px 18px;background:#1f2328;border-bottom:1px solid var(--line2)}
  .mark{width:30px;height:30px;background:var(--amber);color:#161000;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
  .head h1{font-size:17px}
  .badge{margin-left:auto;border:1px solid #2c6b43;color:var(--green);padding:2px 8px;font-size:11px}
  .body{padding:16px 18px}
  h2{font-size:12px;letter-spacing:1.2px;color:var(--amber);border-bottom:1px solid var(--line);padding-bottom:4px;margin:14px 0 10px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .box{background:#121518;border:1px solid var(--line);padding:12px}
  .foot{padding:8px 18px;border-top:1px solid var(--line2);background:#15181b;color:var(--faint);font-size:11px;display:flex;justify-content:space-between}
</style>
</head>
<body>
<div class="sheet">
  <header class="head">
    <div class="mark">工</div>
    <h1>6. 渲染与缓存（元信息比对 · 画布外50% · 异步QOI落盘）</h1>
    <span class="badge">已确认 · 2026-11-17</span>
  </header>

  <div class="body">
    <div class="grid">
      <!-- 左：画布外拓展 50% 示意图 -->
      <div class="box">
        <h2>1. 缓存区域：默认画布外拓展 50%（透明底）</h2>
        <svg viewBox="0 0 480 220" width="100%" style="display:block">
          <!-- 缓存总范围 -->
          <rect x="30" y="16" width="420" height="186" fill="#14191f" stroke="#4cc9f0" stroke-dasharray="5,3" stroke-width="1.5"/>
          <text x="40" y="34" fill="#4cc9f0" font-size="11">缓存图像范围（画布外默认 +50%，透明底，可在设置调整）</text>

          <!-- 默认画布 -->
          <rect x="120" y="56" width="240" height="114" fill="#1e242c" stroke="#ffb000" stroke-width="1.5"/>
          <text x="240" y="114" fill="#ffb000" font-size="12" text-anchor="middle">项目画布框</text>
          <text x="240" y="132" fill="#9aa3ac" font-size="10" text-anchor="middle">画布外实体也在缓存内</text>

          <!-- 标注 -->
          <text x="240" y="192" fill="#9aa3ac" font-size="10" text-anchor="middle">透明度 = 0 的实体直接跳过渲染 · Gizmo 不进缓存</text>
        </svg>
      </div>

      <!-- 右：HTML 缓存元数据 -->
      <div class="box">
        <h2>2. HTML 组件缓存与三进程</h2>
        <svg viewBox="0 0 480 220" width="100%" style="display:block">
          <rect x="12" y="12" width="456" height="90" fill="#181b1e" stroke="#343b42"/>
          <text x="24" y="34" fill="#ffb000" font-size="11">HTML 元数据 Key（任一不一致即缓存未命中）：</text>
          <text x="24" y="56" fill="#cfd6dd" font-size="11">• HTML 内容哈希 + 自定义变量值 (Timeline 驱动)</text>
          <text x="24" y="74" fill="#cfd6dd" font-size="11">• 分辨率设置（预览低分 / 导出高分）</text>
          <text x="24" y="92" fill="#43d17a" font-size="11">• 浏览器内核与版本号（版本对不上直接失效）</text>

          <rect x="12" y="114" width="456" height="92" fill="#181b1e" stroke="#4cc9f0"/>
          <text x="24" y="136" fill="#4cc9f0" font-size="11">三进程隔离 + 命中零调度：</text>
          <text x="24" y="158" fill="#cfd6dd" font-size="11">1. 前端低分预览进程   2. 缓存渲染进程   3. 成片高分导出进程</text>
          <text x="24" y="180" fill="#9aa3ac" font-size="10">自定义变量不动时（如仅平移/旋转），直接复用缓存图，不唤醒浏览器</text>
        </svg>
      </div>
    </div>

    <h2>3. 舞台帧缓存流水线（零卡顿异步落盘 · 重开可命中）</h2>
    <div class="box">
      <svg viewBox="0 0 1000 130" width="100%" style="display:block">
        <rect x="10" y="24" width="170" height="72" fill="#181b1e" stroke="#4a525a"/>
        <text x="95" y="52" fill="#e6e8ea" font-size="11" text-anchor="middle">请求帧 N 渲染</text>
        <text x="95" y="72" fill="#667079" font-size="10" text-anchor="middle">交互拖动 Gizmo 跳过缓存</text>

        <line x1="180" y1="60" x2="225" y2="60" stroke="#ffb000" stroke-width="1.5"/>
        <polygon points="225,60 217,55 217,65" fill="#ffb000"/>

        <rect x="225" y="24" width="210" height="72" fill="#181b1e" stroke="#ffb000"/>
        <text x="330" y="52" fill="#ffb000" font-size="11" text-anchor="middle">当前帧实体元信息</text>
        <text x="330" y="72" fill="#9aa3ac" font-size="10" text-anchor="middle">与磁盘缓存二进制比对</text>

        <!-- 命中 -->
        <line x1="435" y1="42" x2="510" y2="30" stroke="#43d17a" stroke-width="1.5"/>
        <rect x="510" y="10" width="470" height="40" fill="#14221a" stroke="#43d17a"/>
        <text x="525" y="34" fill="#43d17a" font-size="11">HIT → 直接读取缓存图贴到舞台（重开工程照样命中）</text>

        <!-- 未命中 -->
        <line x1="435" y1="78" x2="510" y2="90" stroke="#4cc9f0" stroke-width="1.5"/>
        <rect x="510" y="68" width="470" height="50" fill="#16212b" stroke="#4cc9f0"/>
        <text x="525" y="90" fill="#4cc9f0" font-size="11">MISS → 立即现算渲染给用户看（不阻塞播放）</text>
        <text x="525" y="108" fill="#9aa3ac" font-size="10">同时复制一份丢给后台多线程异步编码 QOI + 元信息落盘</text>
      </svg>
    </div>
  </div>

  <footer class="foot">
    <span>PVForge · 施工图 #6</span>
    <span>2026-11-17 人类对话对齐确认</span>
  </footer>
</div>
</body>
</html>
