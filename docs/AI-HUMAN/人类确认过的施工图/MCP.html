<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCP 工具与权限 UI 施工图 · PVForge</title>
<style>
  :root{
    --bg:#0f1114;--panel:#181b1e;--line:#343b42;--line2:#4a525a;
    --text:#e6e8ea;--dim:#9aa3ac;--faint:#667079;--amber:#ffb000;--cyan:#4cc9f0;
    --green:#43d17a;--red:#ff5d5d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font:12px/1.5 "Noto Sans Mono CJK SC","JetBrains Mono",monospace;padding:20px}
  .sheet{max-width:1080px;margin:0 auto;border:1px solid var(--line2);background:var(--panel)}
  .head{display:flex;align-items:center;gap:14px;padding:12px 18px;background:#1f2328;border-bottom:1px solid var(--line2)}
  .mark{width:30px;height:30px;background:var(--amber);color:#161000;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
  .head h1{font-size:17px}
  .badge{margin-left:auto;border:1px solid #2c6b43;color:var(--green);padding:2px 8px;font-size:11px}
  .body{padding:16px 18px}
  h2{font-size:12px;letter-spacing:1.2px;color:var(--amber);border-bottom:1px solid var(--line);padding-bottom:4px;margin:14px 0 10px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .box{background:#121518;border:1px solid var(--line);padding:12px}
  .foot{padding:8px 18px;border-top:1px solid var(--line2);background:#15181b;color:var(--faint);font-size:11px;display:flex;justify-content:space-between}
</style>
</head>
<body>
<div class="sheet">
  <header class="head">
    <div class="mark">工</div>
    <h1>9. MCP 工具与权限（Git 前置 · 可配监听地址 · 实时日志窗）</h1>
    <span class="badge">已确认 · 2026-11-17</span>
  </header>

  <div class="body">
    <div class="grid">
      <!-- 左：设置面板里的 MCP 配置 -->
      <div class="box">
        <h2>1. 设置页 · MCP 开关与绑定地址</h2>
        <svg viewBox="0 0 480 240" width="100%" style="display:block">
          <rect x="8" y="8" width="464" height="224" fill="#181b1e" stroke="#343b42"/>
          <text x="20" y="30" fill="#ffb000" font-size="11">MCP 服务配置（默认关闭，需人类手动启用）</text>

          <!-- Git 前置校验条 -->
          <rect x="20" y="42" width="440" height="32" fill="#2a1919" stroke="#ff5d5d"/>
          <text x="30" y="62" fill="#ff5d5d" font-size="11">前置条件：当前工程必须已开启 Git（未开 Git 禁用此开关）</text>

          <!-- 开关 -->
          <rect x="20" y="86" width="18" height="18" fill="#14221a" stroke="#43d17a"/>
          <text x="25" y="99" fill="#43d17a" font-size="12">✓</text>
          <text x="46" y="99" fill="#e6e8ea" font-size="11">启用本地 MCP HTTP 服务</text>

          <!-- 监听地址：127.0.0.1 / 0.0.0.0 / 自定义 -->
          <text x="20" y="128" fill="#cfd6dd" font-size="11">监听地址（可选）：</text>
          <rect x="20" y="138" width="130" height="24" fill="#232830" stroke="#4cc9f0"/>
          <text x="85" y="154" fill="#4cc9f0" font-size="10" text-anchor="middle">● 127.0.0.1 (默认)</text>
          <rect x="158" y="138" width="120" height="24" fill="#20242a" stroke="#4a525a"/>
          <text x="218" y="154" fill="#cfd6dd" font-size="10" text-anchor="middle">○ 0.0.0.0</text>
          <rect x="286" y="138" width="174" height="24" fill="#20242a" stroke="#4a525a"/>
          <text x="373" y="154" fill="#9aa3ac" font-size="10" text-anchor="middle">○ 自定义 IP : 端口</text>

          <!-- Token 安全 -->
          <rect x="20" y="176" width="440" height="42" fill="#121518" stroke="#343b42"/>
          <text x="30" y="194" fill="#43d17a" font-size="10">鉴权：强制 Bearer Token (0600 权限) · 拒绝请求走私</text>
          <text x="30" y="210" fill="#9aa3ac" font-size="10">保护：每次 MCP 写操作自动触发一次 Git commit Checkpoint</text>
        </svg>
      </div>

      <!-- 右：OBS 式可拆 MCP 日志窗 + 注释关键帧 -->
      <div class="box">
        <h2>2. 可拆 MCP 日志窗 + 注释关键帧（给 AI 看）</h2>
        <svg viewBox="0 0 480 240" width="100%" style="display:block">
          <!-- 日志窗 -->
          <rect x="8" y="8" width="464" height="140" fill="#14171b" stroke="#4cc9f0"/>
          <rect x="8" y="8" width="464" height="22" fill="#1a242b" stroke="#343b42"/>
          <text x="18" y="23" fill="#4cc9f0" font-size="10">MCP 操作日志窗 [OBS 式可拆出 · 实时显示 AI 动作]</text>
          <text x="18" y="48" fill="#43d17a" font-size="10">[14:02:11] move_entity(uuid=e1b2, x=120, y=-40) → git commit a8f3c</text>
          <text x="18" y="68" fill="#43d17a" font-size="10">[14:02:13] add_keyframe(uuid=e1b2, frame=90)     → git commit b91d2</text>
          <text x="18" y="88" fill="#ffb000" font-size="10">[14:02:15] render_snapshot(frame=90)             → 返图给 AI 校验</text>
          <text x="18" y="112" fill="#9aa3ac" font-size="10">人类可直观盯盘，随时 Ctrl+Z 或回滚任意 Git Checkpoint</text>

          <!-- 注释关键帧 -->
          <rect x="8" y="160" width="464" height="72" fill="#181b1e" stroke="#ffb000"/>
          <text x="18" y="180" fill="#ffb000" font-size="11">前置辅助：注释关键帧（AI 没有耳朵，靠文字定位节奏）</text>
          <polygon points="32,205 38,199 44,205 38,211" fill="#ffb000"/>
          <text x="54" y="209" fill="#e6e8ea" font-size="10">frame=120  注释:「副歌鼓点进入 · 主角立绘切入」</text>
          <text x="54" y="224" fill="#667079" font-size="9">MCP 查询时间轴时同步读取注释文本</text>
        </svg>
      </div>
    </div>
  </div>

  <footer class="foot">
    <span>PVForge · 施工图 #9</span>
    <span>2026-11-17 人类对话对齐确认</span>
  </footer>
</div>
</body>
</html>
