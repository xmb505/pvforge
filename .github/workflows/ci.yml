name: CI

# 两道 gate：代码体量 ratchet，以及 Debug 构建 + `ctest -L self-test`。
# 自检不再只靠本地手跑；缺 ffmpeg/git/Chrome 的用例返回 77，CTest 记为 Skipped。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  code-size:
    name: 代码体量（ratchet）
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 检查 main.cpp 与单文件行数
        run: bash tools/check-code-size.sh

  build-test:
    name: Debug 构建 + 自检
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: 安装系统依赖
        run: ci/install-deps.sh

      - name: 安装 Qt 6.7.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          modules: 'qtmultimedia qtimageformats'
          cache: true

      - name: 配置（Debug + 自检）
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DPVFORGE_BUILD_SELF_TESTS=ON

      - name: 构建
        run: cmake --build build -j 4

      - name: 跑自检
        run: ctest --test-dir build -L self-test --output-on-failure -j 2
