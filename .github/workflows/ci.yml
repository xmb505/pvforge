name: CI

# 目前只保留代码量护栏。构建、测试、Release 仍由本地手动执行；
# 等流程想清楚后再加回 CI，不要先堆一套会互相打架的 gate。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  code-size:
    name: 代码体量（ratchet）
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 检查 main.cpp 与单文件行数
        run: bash tools/check-code-size.sh
